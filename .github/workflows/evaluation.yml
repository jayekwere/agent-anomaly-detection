name: evaluation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m ruff check agent_anomaly test_audit.py test_sequence.py test_combined.py scripts
      - run: python -m ruff format --check agent_anomaly test_audit.py test_sequence.py test_combined.py scripts
      - run: python -m coverage run -m unittest -v
      - run: python -m bandit -r agent_anomaly scripts -q
      - run: python -m pip_audit -r requirements.txt --no-deps --disable-pip
      - run: python -m agent_anomaly --output artifacts/first
      - run: python -m agent_anomaly --output artifacts/second
      - run: diff -r artifacts/first artifacts/second
      - run: python -c "from pathlib import Path; from agent_anomaly.artifacts import validate; validate(Path('artifacts/first/results.json'))"
      - run: python -m coverage run --append -m agent_anomaly.sequence_experiment --output artifacts/sequence-first
      - run: python -m agent_anomaly.sequence_experiment --output artifacts/sequence-second
      - run: diff -r artifacts/sequence-first artifacts/sequence-second
      - run: python scripts/verify_sequence_results.py artifacts/sequence-first/results.json --reference evaluation/sequence-v1/results.json
      - run: python -m coverage run --append -m agent_anomaly.combined_experiment --output artifacts/combined-first
      - run: python -m agent_anomaly.combined_experiment --output artifacts/combined-second
      - run: python -m coverage report
      - run: diff -r artifacts/combined-first artifacts/combined-second
      - run: python scripts/verify_combined_results.py artifacts/combined-first/results.json --reference evaluation/combined-v1/results.json
      - run: python evaluate.py --output artifacts/historical.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: evaluation-python-${{ matrix.python }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
