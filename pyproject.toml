[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-anomaly-evaluation"
version = "0.4.0"
description = "Synthetic behavioral anomaly evaluation for AI agent audit events"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["agent_anomaly*"]

[project.scripts]
agent-anomaly = "agent_anomaly.__main__:main"

[tool.ruff]
line-length = 100

[tool.coverage.run]
source = ["agent_anomaly"]
omit = ["agent_anomaly/__main__.py"]

[tool.coverage.report]
fail_under = 75
show_missing = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.package-data]
agent_anomaly = ["plans/*.json"]
